<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaultfall — One Night at the Meridian</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #060a14; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; background: #0d1526; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Vaultfall: a top-down stealth heist. Move with WASD, sneak with Shift, toss coins with Q, EMP with E, hold F to lift loot and crack the vault."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
